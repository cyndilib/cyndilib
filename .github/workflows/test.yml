name: Test

on:
  push:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "setup.cfg"
    - "src/**"
    - "tests/**"
    - ".github/workflows/test.yml"

  pull_request:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "setup.cfg"
    - "src/**"
    - "tests/**"
    - ".github/workflows/test.yml"

  workflow_dispatch:


jobs:
  test_inplace:
    name: Test on ${{ matrix.os }}_${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest, blacksmith-2vcpu-windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Project
        run: uv sync --frozen --group test
        env:
          CYNDILIB_BUILD_PARALLEL: auto
      - name: Compile tests
        run: uv run python build_tests.py
      - name: Run tests
        run: uv run pytest --skip-flaky
