name: Build Wheels

on:
  push:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "setup.cfg"
    - "src/cyndilib/wrapper/**"
    - ".github/workflows/build_wheels.yml"

  pull_request:
    branches: [ main ]
    paths:
    - "pyproject.toml"
    - "uv.lock"
    - "setup.py"
    - "setup.cfg"
    - "src/cyndilib/wrapper/**"
    - ".github/workflows/build_wheels.yml"

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip cibuildwheel tests"
        required: true
        type: boolean
      os_type:
        description: "OS"
        default: "all"
        type: choice
        options:
        - macos-latest
        - ubuntu-latest
        - windows-latest
        - all
      allow_deploy:
        description: "Deploy to PyPI"
        required: true
        type: boolean


jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}_${{ matrix.python-version }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'nocarryr') || (github.event_name == 'push' && github.actor == 'nocarryr')) && matrix.blacksmith_runner || matrix.github_runner }}
    env:
      CIBW_ARCHS: ${{ matrix.cibw_arch }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["cp311", "cp312", "cp313", "cp314", "cp315"]
        os:
          - linux-x64
          - linux-arm64
          - windows-x64
          - macos-arm64
          - macos-intel
        include:
          - os: linux-x64
            blacksmith_runner: blacksmith-2vcpu-ubuntu-2404
            github_runner: ubuntu-24.04
            cibw_arch: x86_64

          - os: linux-arm64
            blacksmith_runner: blacksmith-4vcpu-ubuntu-2404-arm
            github_runner: ubuntu-24.04-arm
            cibw_arch: aarch64

          - os: windows-x64
            blacksmith_runner: blacksmith-2vcpu-windows-2025
            github_runner: windows-2025
            cibw_arch: AMD64

          - os: macos-arm64
            blacksmith_runner: blacksmith-6vcpu-macos-latest
            github_runner: macos-15
            cibw_arch: arm64

          # Blacksmith doesn't offer Intel macOS runners.
          - os: macos-intel
            blacksmith_runner: macos-15-intel
            github_runner: macos-15-intel
            cibw_arch: x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
        if: runner.os == 'macOS' && runner.arch == 'ARM64'

      - name: Set cibuildwheel env
        id: cibuildwheel_env
        run: |
          CIBW_TEST_SKIP="cp38-macosx*"
          if [ "${{ inputs.skip_tests }}" == "true" ]; then
            echo "skip_tests is true"
            CIBW_TEST_SKIP="*"
          fi
          echo "test_skip=$CIBW_TEST_SKIP" >> $GITHUB_OUTPUT
        shell: bash

      - name: Debug env step
        run: |
          echo "test_skip = ${{ steps.cibuildwheel_env.outputs.test_skip }}"
          echo "skip_build = ${{ steps.cibuildwheel_env.outputs.skip_build }}"
        shell: bash

      - name: Build wheels
        id: build_wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_ARCHS: ${{ env.CIBW_ARCHS }}
          CIBW_TEST_SKIP: ${{ steps.cibuildwheel_env.outputs.test_skip }}
        if: ${{ !inputs.os_type || inputs.os_type == matrix.os || inputs.os_type == 'all' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.build_wheel.outcome == 'success' }}
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.cibw_arch }}

  deploy:
    name: Deploy to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-24.04
    if: ${{ inputs.allow_deploy }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
