name: Codspeed

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "src/**"
      - "tests/**"
      - ".github/workflows/codspeed.yml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "src/**"
      - "tests/**"
      - ".github/workflows/codspeed.yml"
      - "uv.lock"

  workflow_dispatch:

jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install Project
        run: uv sync --frozen --group test
        env:
          CYNDILIB_BUILD_PARALLEL: auto

      - name: Compile tests
        run: uv run python build_tests.py

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5
        with:
          mode: simulation
          run: uv run py.test tests/ --codspeed -n=0
